name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'libs/mozart-assets/**'
      - 'libs/shared-util-analytics/**'
      - 'libs/shared-util-theme/**'
      - 'libs/mozart-design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

jobs:
  validate:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-web-${{ runner.os }}-

      - run: pnpm nx affected -t lint typecheck --parallel=3 --exclude=sandbox,sandbox-e2e

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-web-${{ runner.os }}-

      # Write apps/web/.env from GitHub Variables.
      # On main: full set → analytics enabled.
      # On PR previews: Clerk key only → analytics silenced.
      - name: Write apps/web/.env for build
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          printf 'CLERK_PUBLISHABLE_KEY=%s\n' "$CLERK_PUBLISHABLE_KEY" > apps/web/.env
          printf 'POSTHOG_HOST=%s\n' "$POSTHOG_HOST" >> apps/web/.env

      - name: Add PostHog key (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
        run: printf 'POSTHOG_KEY=%s\n' "$POSTHOG_KEY" >> apps/web/.env

      - name: Inject .env values into Angular define
        run: node apps/web/inject-define.mjs

      - run: pnpm nx run web:build:production

      # Pages Functions live in apps/web/functions/ but wrangler discovers
      # them at <deploy-dir>/functions/. Copy them into the build tree first.
      - name: Bundle Pages Functions into deploy tree
        run: cp -r apps/web/functions dist/apps/web/browser/functions

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/apps/web/browser
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      # Hoist Functions to workspace root so wrangler's CWD-relative lookup finds them.
      - name: Hoist Pages Functions to workspace root for wrangler discovery
        run: mv dist/functions functions

      # Deploy first so the project exists before secret-sync runs.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy dist
            --project-name=mozart-web
            --branch=${{ github.head_ref || github.ref_name }}

      # Sync secret after deploy so the project is guaranteed to exist.
      - name: Sync CLERK_SECRET_KEY to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          printf '{"CLERK_SECRET_KEY":"%s"}' "$CLERK_SECRET_KEY" \
            | npx wrangler@4 pages secret bulk \
                --project-name=mozart-web

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Web app preview deployed**\n\n${{ steps.deploy.outputs.deployment-url }}`
            })
