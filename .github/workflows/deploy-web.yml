name: Deploy Web

on:
  # Cloudflare Pages `mozart-web` is a Direct Upload project — its Git
  # integration is intentionally disconnected. A Git-connected project
  # auto-builds on push and OWNS the production slot, which silently
  # clobbers these wrangler deploys (and 404s app.mozart.build). Keep it
  # disconnected: GitHub Actions is the only deployer.
  #
  # Branch model: push to `main` → production (app.mozart.build); push
  # to `develop` and PRs → *.mozart-web.pages.dev preview.
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'libs/clerk/**'
      - 'libs/mozart-assets/**'
      - 'libs/shared-util-analytics/**'
      - 'libs/shared-util-theme/**'
      - 'libs/mozart-design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

jobs:
  validate:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-web-${{ runner.os }}-

      - run: pnpm nx affected -t lint typecheck --parallel=3 --exclude=sandbox,sandbox-e2e

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-web-${{ runner.os }}-

      # Write environment.prod.ts from GitHub Variables before the Angular build.
      # On main (production): full set → analytics enabled.
      # On develop / PR previews: Clerk key only → analytics silenced (posthogKey stays empty).
      - name: Write environment.prod.ts for build
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
        run: |
          PHOG_KEY=""
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            PHOG_KEY="$POSTHOG_KEY"
          fi
          printf 'export const environment = {\n  clerkPublishableKey: "%s",\n  posthogKey: "%s",\n  posthogHost: "%s",\n};\n' \
            "$CLERK_PUBLISHABLE_KEY" "$PHOG_KEY" "$POSTHOG_HOST" \
            > apps/web/src/environments/environment.prod.ts

      - run: pnpm nx run web:build:production

      # Pages Functions live in apps/web/functions/ but wrangler discovers
      # them at <deploy-dir>/functions/. Copy them into the build tree first.
      - name: Bundle Pages Functions into deploy tree
        run: cp -r apps/web/functions dist/apps/web/functions

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/apps/web
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Wrangler bundles Pages Functions with esbuild at deploy time and
      # needs to resolve runtime deps (@clerk/backend, etc.) from
      # node_modules. Without these install steps the bundle fails with
      # "Could not resolve '@clerk/backend'".
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      # Hoist Functions to workspace root so wrangler's CWD-relative lookup finds them.
      - name: Hoist Pages Functions to workspace root for wrangler discovery
        run: mv dist/functions functions

      # Deploy first so the project exists before secret-sync runs.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # A Direct Upload deployment lands on production (the custom
          # domain app.mozart.build) when --branch matches the project's
          # production branch, which is `main`. So a push to `main`
          # deploys prod; `develop` and PR branches get their own
          # *.mozart-web.pages.dev preview slot.
          command: >-
            pages deploy dist
            --project-name=mozart-web
            --branch=${{ github.head_ref || github.ref_name }}

      # Sync secret after deploy so the project is guaranteed to exist.
      - name: Sync CLERK_SECRET_KEY to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          printf '{"CLERK_SECRET_KEY":"%s"}' "$CLERK_SECRET_KEY" \
            | npx wrangler@4 pages secret bulk \
                --project-name=mozart-web

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Web app preview deployed**\n\n${{ steps.deploy.outputs.deployment-url }}`
            })
