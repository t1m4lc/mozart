name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'libs/mozart-assets/**'
      - 'libs/shared-util-analytics/**'
      - 'libs/shared-util-theme/**'
      - 'libs/mozart-design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    paths:
      - 'apps/landing/**'
      - 'libs/mozart-assets/**'
      - 'libs/shared-util-analytics/**'
      - 'libs/shared-util-theme/**'
      - 'libs/mozart-design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-landing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-landing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-landing-${{ runner.os }}-

      # Write environment.prod.ts from GitHub Variables (main only).
      # PR previews build without this step → analytics no-ops (empty defaults).
      - name: Write environment.prod.ts for build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          printf 'export const environment = {\n  posthogKey: "%s",\n  posthogHost: "%s",\n};\n' \
            "$POSTHOG_KEY" "$POSTHOG_HOST" \
            > apps/landing/src/environments/environment.prod.ts

      # seo-check transitively depends on generate-llms → post-build-seo → build
      - run: pnpm nx run landing:seo-check

      # Cloudflare Pages Functions live in apps/landing/functions/ but the build
      # output is dist/apps/landing/analog/public/. wrangler `pages deploy <dir>`
      # discovers functions at <dir>/functions/, so we copy them into the deploy
      # tree before uploading the artifact. Without this step CF serves a generic
      # 405 for /api/analytics/* because the routes are never registered.
      - name: Bundle Pages Functions into deploy tree
        run: cp -r apps/landing/functions dist/apps/landing/analog/public/functions

      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: dist/apps/landing/analog/public
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: dist

      # wrangler `pages deploy <dir>` discovers Functions at
      # path.join(process.cwd(), "functions") — NOT <dir>/functions. The build
      # job bundled them into dist/functions/; hoist them to the workspace root
      # so wrangler's CWD-relative lookup finds them.
      - name: Hoist Pages Functions to workspace root for wrangler discovery
        run: mv dist/functions functions

      # GitHub is the source of truth for runtime secrets. We push them to CF
      # Pages on every main push so a secret rotation in GitHub propagates on
      # the next deploy. Skipped on PRs — previews don't get the token, so
      # /api/analytics/set-internal-device 503s there (acceptable).
      #
      # NOT synced here: functions/api/waitlist.ts needs a KV namespace bound
      # as `WAITLIST` on the mozart-landing Pages project (Production AND
      # Preview). Direct Upload deploys can't carry bindings — set it once in
      # the CF dashboard (Settings → Functions → KV namespace bindings) and it
      # persists across deploys. Without it, /api/waitlist returns 503.
      - name: Sync runtime secrets to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_DEVICE_TOKEN: ${{ secrets.INTERNAL_DEVICE_TOKEN }}
          # Beta download gate (functions/api/download.ts). Unset this secret
          # to open downloads to everyone post beta.0.x — no code change.
          DOWNLOAD_CODE: ${{ secrets.DOWNLOAD_CODE }}
          # Discord webhook for new waitlist signups (functions/api/waitlist.ts).
          # Separate from the release webhook — no conflict.
          DISCORD_WAITLIST_WEBHOOK_URL: ${{ secrets.DISCORD_WAITLIST_WEBHOOK_URL }}
        run: |
          printf '{"INTERNAL_DEVICE_TOKEN":"%s","DOWNLOAD_CODE":"%s","DISCORD_WAITLIST_WEBHOOK_URL":"%s"}' \
            "$INTERNAL_DEVICE_TOKEN" "$DOWNLOAD_CODE" "$DISCORD_WAITLIST_WEBHOOK_URL" \
            | npx wrangler@4 pages secret bulk \
                --project-name=mozart-landing

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            pages deploy dist
            --project-name=mozart-landing
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Landing preview deployed**\n\n${{ steps.deploy.outputs.deployment-url }}`
            })

  indexnow:
    name: IndexNow ping
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0

      # The deployed sitemap (already trailing-slash canonical) drives the URL
      # list. Read it from the build artifact rather than re-fetching the live
      # site, which Cloudflare bot protection 403s for unverified clients.
      - uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: dist

      - name: Submit sitemap URLs to IndexNow
        run: node apps/landing/scripts/submit-indexnow.mjs dist/sitemap.xml

  notify-blog:
    name: Announce new blog posts
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Post a Discord message for each blog post ADDED in this push (edits to
      # existing posts are ignored). Reuses the same webhook as release
      # announcements (DISCORD_WEBHOOK_URL); no-ops when the secret is unset.
      - name: Announce added blog posts to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping."
            exit 0
          fi

          # A branch's first push reports an all-zero "before"; fall back to the
          # pushed commit's first parent so the diff still resolves.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="${AFTER}^"
          fi

          added=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" \
            -- apps/landing/src/content/blog/ | { grep '\.md$' || true; })

          if [ -z "$added" ]; then
            echo "No new blog posts in this push."
            exit 0
          fi

          echo "$added" | while IFS= read -r file; do
            [ -n "$file" ] || continue
            slug=$(basename "$file" .md)
            title=$(grep -m1 '^title:' "$file" \
              | sed -E "s/^title:[[:space:]]*//; s/^['\"]//; s/['\"][[:space:]]*$//")
            [ -n "$title" ] || title="$slug"
            url="https://mozart.build/blog/${slug}/"
            payload=$(jq -n --arg t "$title" --arg u "$url" \
              '{content: ("📝 New post on the Mozart blog: **" + $t + "**\n" + $u)}')
            curl -s -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$payload"
          done
