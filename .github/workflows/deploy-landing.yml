name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'libs/mozart-assets/**'
      - 'libs/shared-util-analytics/**'
      - 'libs/shared-util-theme/**'
      - 'libs/mozart-design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    paths:
      - 'apps/landing/**'
      - 'libs/mozart-assets/**'
      - 'libs/shared-util-analytics/**'
      - 'libs/shared-util-theme/**'
      - 'libs/mozart-design-tokens/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

jobs:
  validate:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-landing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-landing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-landing-${{ runner.os }}-

      - run: pnpm nx affected -t lint typecheck --parallel=3 --exclude=sandbox,sandbox-e2e

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-landing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-landing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-landing-${{ runner.os }}-

      # Write environment.prod.ts from GitHub Variables (main only).
      # PR previews build without this step → analytics no-ops (empty defaults).
      - name: Write environment.prod.ts for build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          printf 'export const environment = {\n  posthogKey: "%s",\n  posthogHost: "%s",\n};\n' \
            "$POSTHOG_KEY" "$POSTHOG_HOST" \
            > apps/landing/src/environments/environment.prod.ts

      # seo-check transitively depends on generate-llms → post-build-seo → build
      - run: pnpm nx run landing:seo-check

      # Cloudflare Pages Functions live in apps/landing/functions/ but the build
      # output is dist/apps/landing/analog/public/. wrangler `pages deploy <dir>`
      # discovers functions at <dir>/functions/, so we copy them into the deploy
      # tree before uploading the artifact. Without this step CF serves a generic
      # 405 for /api/analytics/* because the routes are never registered.
      - name: Bundle Pages Functions into deploy tree
        run: cp -r apps/landing/functions dist/apps/landing/analog/public/functions

      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: dist/apps/landing/analog/public
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: dist

      # wrangler `pages deploy <dir>` discovers Functions at
      # path.join(process.cwd(), "functions") — NOT <dir>/functions. The build
      # job bundled them into dist/functions/; hoist them to the workspace root
      # so wrangler's CWD-relative lookup finds them.
      - name: Hoist Pages Functions to workspace root for wrangler discovery
        run: mv dist/functions functions

      # GitHub is the source of truth for runtime secrets. We push them to CF
      # Pages on every main push so a secret rotation in GitHub propagates on
      # the next deploy. Skipped on PRs — previews don't get the token, so
      # /api/analytics/set-internal-device 503s there (acceptable).
      - name: Sync runtime secrets to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_DEVICE_TOKEN: ${{ secrets.INTERNAL_DEVICE_TOKEN }}
          # Beta download gate (functions/api/download.ts). Unset this secret
          # to open downloads to everyone post beta.0.x — no code change.
          DOWNLOAD_CODE: ${{ secrets.DOWNLOAD_CODE }}
        run: |
          printf '{"INTERNAL_DEVICE_TOKEN":"%s","DOWNLOAD_CODE":"%s"}' \
            "$INTERNAL_DEVICE_TOKEN" "$DOWNLOAD_CODE" \
            | npx wrangler@4 pages secret bulk \
                --project-name=mozart-landing

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy dist
            --project-name=mozart-landing
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Landing preview deployed**\n\n${{ steps.deploy.outputs.deployment-url }}`
            })
