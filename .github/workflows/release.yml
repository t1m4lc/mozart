name: Release Desktop

# Triggered when the CI workflow completes successfully on a `v*` tag.
# Builds and signs the
# desktop bundles for the 4-platform matrix, then creates a GitHub
# Release in DRAFT with the bundles + latest.json updater manifest
# attached. tauri-action handles bundling + signing + release creation;
# the human reviews the draft and clicks "Publish release" to make it
# discoverable by the auto-updater.
#
# See docs/cloud-app/release-runbook.md for the human-facing flow,
# docs/cloud-app/desktop-release-automation.md for architecture.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release, e.g. v0.1.0-beta.1'
        required: true

permissions:
  contents: write # createRelease + uploadReleaseAsset

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-latest
            target: ''
            args: ''
          - platform: windows-latest
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          filter: tree:0
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Add Rust target (macOS only)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri -> target
          key: ${{ matrix.target }}-v2

      # Write environment.prod.ts from GitHub Variables before tauri-action
      # runs the frontend build (`beforeBuildCommand: pnpm nx build desktop` in
      # tauri.conf.json) which swaps it in via fileReplacements. Mirrors
      # deploy-web.yml; no main-branch gate because this workflow is tag-only
      # (every run is a release). webBaseUrl stays the fixed prod origin.
      - name: Write environment.prod.ts for build
        shell: bash
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
        run: |
          printf 'export const environment = {\n  webBaseUrl: "%s",\n  posthogKey: "%s",\n  posthogHost: "%s",\n};\n' \
            "https://app.mozart.build" "$POSTHOG_KEY" "$POSTHOG_HOST" \
            > apps/desktop/src/environments/environment.prod.ts

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ed25519 key from `pnpm tauri signer generate`. Used to sign
          # both the bundle and the matching updater signature shipped
          # in latest.json. Public counterpart lives in tauri.conf.json
          # → plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-tauri
          tagName: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          releaseName: 'Mozart ${{ inputs.tag || github.event.workflow_run.head_branch }}'
          # Drives the GitHub Release description. Points users at the
          # human-readable landing changelog rather than dumping the
          # full CHANGELOG.md (the developer log).
          releaseBody: |
            See https://mozart.build/changelog/${{ inputs.tag || github.event.workflow_run.head_branch }} for the full changelog.

            Auto-updater: installed apps will detect this release at next launch and download in the background. Click "Restart now" in the banner when ready.
          # Draft so a human reviews the artifact set before users see
          # latest.json. Publishing is a manual click in the GitHub UI.
          releaseDraft: true
          # Beta / alpha / RC tags get prerelease=true so GitHub's
          # `/releases/latest` endpoint keeps pointing at the last
          # stable. Stable v0.1.0+ gets prerelease=false.
          prerelease: ${{ contains(inputs.tag || github.event.workflow_run.head_branch, 'beta') || contains(inputs.tag || github.event.workflow_run.head_branch, 'alpha') || contains(inputs.tag || github.event.workflow_run.head_branch, 'rc') }}
          args: ${{ matrix.args }}
          # Tells tauri-action to emit the updater manifest
          # (latest.json) alongside the bundle artifacts. The mirror-r2
          # job below rewrites its URLs to dl.mozart.build, the endpoint
          # the installed app actually reads (plugins.updater in tauri.conf).
          includeUpdaterJson: true

  # Mirror the signed bundles + updater manifest from the (draft) GitHub
  # Release to Cloudflare R2 — the real distribution surface. The repo is
  # private, so GitHub asset URLs aren't anonymously reachable; R2 is.
  # This job:
  #   1. downloads every asset from the draft release (incl. latest.json)
  #   2. rewrites latest.json platform URLs to https://dl.mozart.build/v<ver>/…
  #   3. emits manifest.json (OS -> installer filename) for the landing
  #      download gate (apps/landing/functions/api/download.ts)
  #   4. uploads everything to mozart-downloads/v<ver>/… and the updater
  #      feed to mozart-downloads/latest.json (bucket root)
  # Publishing the GitHub Release is no longer required for distribution.
  mirror-r2:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag + version
        run: |
          TAG="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*'
          ls -la assets

      - name: Rewrite latest.json URLs + build manifest.json
        run: |
          base="https://dl.mozart.build/v$VERSION"
          jq --arg base "$base" \
            '.platforms |= with_entries(.value.url = ($base + "/" + (.value.url | split("/") | last)))' \
            assets/latest.json > assets/latest.json.tmp
          mv assets/latest.json.tmp assets/latest.json
          cd assets
          mac=$(ls ./*aarch64*.dmg 2>/dev/null | xargs -n1 basename | head -1)
          mac_intel=$(ls ./*x64*.dmg 2>/dev/null | xargs -n1 basename | head -1)
          windows=$(ls ./*-setup.exe 2>/dev/null | xargs -n1 basename | head -1)
          linux=$(ls ./*_amd64.deb 2>/dev/null | xargs -n1 basename | head -1)
          jq -n --arg mac "$mac" --arg maci "$mac_intel" --arg win "$windows" --arg lin "$linux" \
            '{mac:$mac, "mac-intel":$maci, windows:$win, linux:$lin}' > manifest.json
          echo "manifest.json:"; cat manifest.json

      - name: Upload to R2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli v2 sends integrity checksums R2 rejects; only send when
          # the operation actually requires one.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync assets "s3://mozart-downloads/v$VERSION/" \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          # Updater feed lives at the bucket root (plugins.updater endpoint).
          aws s3 cp assets/latest.json "s3://mozart-downloads/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json --no-progress

  notify-discord:
    needs: mirror-r2
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Post release to Discord announcements
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          SLUG="${TAG//./-}"
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"**Mozart $TAG** is out — https://mozart.build/changelog/$SLUG\"}"
