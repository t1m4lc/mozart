name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Bootstrap gitignored env files from their checked-in *.example.ts
      # counterparts so CI can build apps that import them (e.g. apps/web).
      # Real secrets are injected at deploy time, not in CI.
      - name: Bootstrap env files
        run: |
          find apps -name 'env.example.ts' -print0 | while IFS= read -r -d '' example; do
            target="${example%.example.ts}.ts"
            [ -f "$target" ] || cp "$example" "$target"
          done

      - name: Verify scope tags
        run: bash tools/verify-scope-tags.sh

      - run: pnpm nx affected -t lint test build typecheck --parallel=3

      - run: pnpm nx fix-ci
        if: always()

  # Cheap gate: figure out once whether desktop is affected, so the rust
  # matrix jobs can short-circuit without each spinning up a runner.
  rust-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.affected.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - id: affected
        run: |
          if pnpm nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" | grep -qx desktop; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  rust-check:
    needs: rust-gate
    if: needs.rust-gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Linux compiles tests too. macOS / Windows only do cargo-check to
      # catch platform-cfg'd branches (see apps/desktop/src-tauri/src/ide_launch.rs).
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm nx run-many -t cargo-check cargo-test -p desktop
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm nx run desktop:cargo-check
