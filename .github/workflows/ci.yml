name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  # Gate for the Rust matrix. Two independent signals decide whether to run
  # and how broad the matrix should be:
  #   - path-filter on apps/desktop-tauri/** (Nx's `affected` flags Tauri on
  #     any Angular change via implicitDependencies, which over-triggers).
  #   - event type: PRs get Linux-only; main pushes and `v*` tags get the
  #     full Linux/macOS/Windows matrix.
  # Tag pushes always run the full matrix regardless of path-filter.
  rust-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      os_list: ${{ steps.gate.outputs.os_list }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Detect Rust/Tauri path changes
        id: paths
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'apps/desktop-tauri/**'
              - '.github/workflows/ci.yml'

      - name: Decide run + matrix
        id: gate
        run: |
          full='["ubuntu-latest","macos-latest","windows-latest"]'
          linux='["ubuntu-latest"]'
          none='[]'

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "os_list=$full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ steps.paths.outputs.rust }}" != "true" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "os_list=$none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "os_list=$full" >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "os_list=$linux" >> "$GITHUB_OUTPUT"
          fi

  rust-check:
    needs: rust-gate
    if: needs.rust-gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.rust-gate.outputs.os_list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri -> target

      # Linux compiles tests too. macOS / Windows only do cargo-check to
      # catch platform-cfg'd branches (see apps/desktop-tauri/src/ide_launch.rs).
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm nx run-many -t cargo-check cargo-test -p desktop-tauri
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm nx run desktop-tauri:cargo-check
