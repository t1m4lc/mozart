name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Bootstrap gitignored env files from their checked-in *.example.ts
      # counterparts so CI can build apps that import them (e.g. apps/web).
      # Real secrets are injected at deploy time, not in CI.
      - name: Bootstrap env files
        run: |
          find apps -name 'env.example.ts' -print0 | while IFS= read -r -d '' example; do
            target="${example%.example.ts}.ts"
            [ -f "$target" ] || cp "$example" "$target"
          done

      - name: Verify scope tags
        run: bash tools/verify-scope-tags.sh

      - run: pnpm nx affected -t lint test build typecheck --parallel=3 --exclude=sandbox,sandbox-e2e

      - run: pnpm nx fix-ci
        if: always()

  # Gate for the Rust matrix. Two independent signals decide whether to run
  # and how broad the matrix should be:
  #   - path-filter on apps/desktop-tauri/** (Nx's `affected` flags Tauri on
  #     any Angular change via implicitDependencies, which over-triggers).
  #   - event type: PRs get Linux-only; main pushes and `v*` tags get the
  #     full Linux/macOS/Windows matrix.
  # Tag pushes always run the full matrix regardless of path-filter.
  rust-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      os_list: ${{ steps.gate.outputs.os_list }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Detect Rust/Tauri path changes
        id: paths
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'apps/desktop-tauri/**'
              - '.github/workflows/ci.yml'

      - name: Decide run + matrix
        id: gate
        run: |
          full='["ubuntu-latest","macos-latest","windows-latest"]'
          linux='["ubuntu-latest"]'
          none='[]'

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "os_list=$full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ steps.paths.outputs.rust }}" != "true" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "os_list=$none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "os_list=$full" >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "os_list=$linux" >> "$GITHUB_OUTPUT"
          fi

  rust-check:
    needs: rust-gate
    if: needs.rust-gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.rust-gate.outputs.os_list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri -> target

      # Linux compiles tests too. macOS / Windows only do cargo-check to
      # catch platform-cfg'd branches (see apps/desktop-tauri/src/ide_launch.rs).
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm nx run-many -t cargo-check cargo-test -p desktop-tauri
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm nx run desktop-tauri:cargo-check
