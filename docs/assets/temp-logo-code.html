<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: white;
      }

      .mozart-logo path {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: pixel-in 500ms ease-out forwards;
        animation-delay: calc(var(--i) * 18ms);
      }

      @keyframes pixel-in {
        0% {
          opacity: 0;
          transform: scale(0.2) translateY(6px);
        }

        70% {
          opacity: 1;
          transform: scale(1.15) translateY(0);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .mozart-logo:hover path {
        animation: pixel-wave 500ms ease-out both;
        animation-delay: calc(var(--i) * 8ms);
      }

      @keyframes pixel-wave {
        0% {
          transform: translateY(0) scale(1);
        }

        50% {
          transform: translateY(-4px) scale(1.1);
        }

        100% {
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
