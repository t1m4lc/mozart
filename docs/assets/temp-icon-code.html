<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mozart CLI Square Loader</title>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f5f5f5;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;
    }

    .preview {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .mozart-loader {
      --s: 7px;
      --gap: 3px;
      --color: currentColor;

      display: grid;
      grid-template-columns: repeat(3, var(--s));
      grid-template-rows: repeat(4, var(--s));
      gap: var(--gap);
      width: max-content;
      color: #f5f5f5;
    }

    .mozart-loader span {
      width: var(--s);
      height: var(--s);
      background: var(--color);
      opacity: 0.16;
      animation: cli-pulse 1.1s infinite steps(1);
    }

    /*
      Shape based on your SVG:

      X . X
      X X X
      X . X
      X . X
    */
    .mozart-loader span:nth-child(2),
    .mozart-loader span:nth-child(8),
    .mozart-loader span:nth-child(11) {
      visibility: hidden;
    }

    .mozart-loader span:nth-child(1)  { animation-delay: 0s; }
    .mozart-loader span:nth-child(3)  { animation-delay: 0.1s; }
    .mozart-loader span:nth-child(4)  { animation-delay: 0.2s; }
    .mozart-loader span:nth-child(5)  { animation-delay: 0.3s; }
    .mozart-loader span:nth-child(6)  { animation-delay: 0.4s; }
    .mozart-loader span:nth-child(7)  { animation-delay: 0.5s; }
    .mozart-loader span:nth-child(9)  { animation-delay: 0.6s; }
    .mozart-loader span:nth-child(10) { animation-delay: 0.7s; }
    .mozart-loader span:nth-child(12) { animation-delay: 0.8s; }

    @keyframes cli-pulse {
      0%, 100% {
        opacity: 0.16;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .loader-text {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: rgba(245, 245, 245, 0.72);
    }

    .loader-text::after {
      content: "";
      animation: dots 1.2s infinite steps(1);
    }

    @keyframes dots {
      0% {
        content: "";
      }

      25% {
        content: ".";
      }

      50% {
        content: "..";
      }

      75%, 100% {
        content: "...";
      }
    }
  </style>
</head>

<body>
  <div class="preview">
    <div class="mozart-loader" aria-label="Loading">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>
</body>
</html>
