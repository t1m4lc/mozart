[package]
name = "app"
version = "0.0.1"
description = "Mozart desktop"
authors = ["Timothy Alcaide"]
license = "MIT"
repository = "https://github.comt/t1m4lc/mozart"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
# tauri-specta build-side: declared again under build-deps so build.rs can reference it (Step S1.2.8).
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "2.0.0-rc.22"
specta-typescript = "0.0.9"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
# Native folder picker (post-1.8b refactor): replaces the text-only
# AddRepoDialog. Wired in `lib.rs::run()` via `.plugin(tauri_plugin_dialog::init())`
# and exposed to the JS layer via `dialog:allow-open` in
# `capabilities/default.json`. We deliberately do NOT pull
# `dialog:default` (it would also enable save / save-as which we don't
# need in v0.0.1).
tauri-plugin-dialog = "2"

# Desktop notifications — Phase 3a wires a "message_end" notification
# when the user isn't focused on the chat's workspace.
tauri-plugin-notification = "2"

# Custom URL scheme `mozart://auth?token=…&state=…` for the Phase 5
# auth round-trip. The `apps/web` Clerk dashboard launches the URL ;
# the OS hands it to the running desktop instance ; the plugin's
# `on_open_url` callback (wired in `auth/deep_link.rs`) emits the
# typed `DeepLinkReceived` event. Linux dev needs `register_all()` at
# runtime (debug-only) because the .desktop file is only generated
# during `tauri build`.
tauri-plugin-deep-link = "2"

# Single-instance enforcement. REQUIRED on Linux + Windows for the
# deep-link plugin : without it, `xdg-open mozart://...` spawns a new
# binary instead of routing the URL into the running instance. With
# the `deep-link` feature flag enabled, this plugin forwards the
# second-instance argv into the deep-link plugin's URL extractor, so
# `on_open_url` fires on the existing window. macOS routes URLs
# natively — single-instance is harmless there but keeps the
# behavior uniform across OSes.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Encrypted vault for the Mozart auth token (Phase 5 / Atom 3). Future
# migration target for the Anthropic + GitHub credentials currently in
# the `keyring` crate. The plugin's `Builder::new(password_hash_fn)`
# takes a closure that derives the 32-byte vault key from the
# JS-supplied password ; we use sha256 here (`sha2` crate). The JS
# side passes a per-install password derived from `appLocalDataDir`
# + a baked salt — see `tauri-auth.adapter.ts`.
tauri-plugin-stronghold = "2"
sha2 = "0.10"

# Step 1.2 spike deps — used by src/spikes/* and forward-looked by Steps 1.3-1.7
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "2.0.0-rc.22"
specta-typescript = "0.0.9"
portable-pty = "0.8"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "3"
# HTTP probe for `GET https://api.anthropic.com/v1/models` (Step 6 connection
# card). `rustls-tls` avoids the system OpenSSL dep; we don't parse response
# bodies, so no `json` feature is needed — status codes carry the result.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

# Phase 4b — repository file tree:
# `ignore` is the ripgrep walker; honors `.gitignore` natively. `notify` +
# `notify-debouncer-mini` back the FS watcher used by `watch_repository_tree`
# (Atom E). Watcher sends a single ping per debounce window; the front-end
# refetches the tree.
ignore = "0.4"
notify = "6"
notify-debouncer-mini = "0.4"

[dev-dependencies]
tempfile = "3"
anyhow = "1"
specta-typescript = "0.0.9"
