[package]
name = "app"
version = "0.0.1"
description = "Mozart desktop"
authors = ["Timothy Alcaide"]
license = "MIT"
repository = "https://github.comt/t1m4lc/mozart"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
# tauri-specta build-side: declared again under build-deps so build.rs can reference it (Step S1.2.8).
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "2.0.0-rc.22"
specta-typescript = "0.0.9"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
# Native folder picker (post-1.8b refactor): replaces the text-only
# AddRepoDialog. Wired in `lib.rs::run()` via `.plugin(tauri_plugin_dialog::init())`
# and exposed to the JS layer via `dialog:allow-open` in
# `capabilities/default.json`. We deliberately do NOT pull
# `dialog:default` (it would also enable save / save-as which we don't
# need in v0.0.1).
tauri-plugin-dialog = "2"

# Step 1.2 spike deps — used by src/spikes/* and forward-looked by Steps 1.3-1.7
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "2.0.0-rc.22"
specta-typescript = "0.0.9"
portable-pty = "0.8"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
anyhow = "1"
specta-typescript = "0.0.9"
