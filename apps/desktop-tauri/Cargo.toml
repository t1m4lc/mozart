[package]
name = "mozart"
version = "0.1.0-beta.0.1"
description = "Mozart desktop"
authors = ["Timothy Alcaide"]
license = "MIT"
repository = "https://github.comt/t1m4lc/mozart"
edition = "2021"
rust-version = "1.77.2"
default-run = "mozart"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mozart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
# tauri-specta build-side: declared again under build-deps so build.rs can reference it (Step S1.2.8).
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "2.0.0-rc.22"
specta-typescript = "0.0.9"

[dependencies]
## preserve_order: P0.3 needs the JSON-key order of .mozart/run.json to
## drive the Run/Setup tab order — without this feature serde_json sorts
## keys alphabetically. See docs/specs/plan-mozart-dogfood-readiness.md
## § P0.3 Prerequisite.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["image-png", "devtools"] }
tauri-plugin-log = "2"
# Native folder picker (post-1.8b refactor): replaces the text-only
# AddRepoDialog. Wired in `lib.rs::run()` via `.plugin(tauri_plugin_dialog::init())`
# and exposed to the JS layer via `dialog:allow-open` in
# `capabilities/default.json`. We deliberately do NOT pull
# `dialog:default` (it would also enable save / save-as which we don't
# need in v0.1.0-beta.1).
tauri-plugin-dialog = "2"

# Desktop notifications — Phase 3a wires a "message_end" notification
# when the user isn't focused on the chat's workspace.
tauri-plugin-notification = "2"

# Custom URL scheme `mozart://auth?token=…&state=…` for the Phase 5
# auth round-trip. The `apps/web` Clerk dashboard launches the URL ;
# the OS hands it to the running desktop instance ; the plugin's
# `on_open_url` callback (wired in `auth/deep_link.rs`) emits the
# typed `DeepLinkReceived` event. Linux dev needs `register_all()` at
# runtime (debug-only) because the .desktop file is only generated
# during `tauri build`.
tauri-plugin-deep-link = "2"

# Single-instance enforcement. REQUIRED on Linux + Windows for the
# deep-link plugin : without it, `xdg-open mozart://...` spawns a new
# binary instead of routing the URL into the running instance. With
# the `deep-link` feature flag enabled, this plugin forwards the
# second-instance argv into the deep-link plugin's URL extractor, so
# `on_open_url` fires on the existing window. macOS routes URLs
# natively — single-instance is harmless there but keeps the
# behavior uniform across OSes.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Phase 5 auth-session storage uses the `keyring` crate already
# declared above (same pattern as the Anthropic + GitHub tokens in
# `credentials/`). `tauri-plugin-stronghold` was tried first per
# onboarding-and-auth.md §6 but its IPC bridge (v2.3.1) leaves the
# snapshot's temp-file mid-write on Linux — see commit history. The
# "all secrets in one vault" goal is deferred to a post-MVP hardening
# task ; for now Mozart auth shares the OS keyring with the existing
# credential pattern.

# Shell plugin (Phase 5 / Atom 4) : `shell.open(url)` from the JS
# adapter launches the user's default browser at the apps/web sign-in
# URL. Scoped via `shell:allow-open` in capabilities/default.json so
# we cannot be tricked into opening arbitrary URLs.
tauri-plugin-shell = "2"

# Auto-updater (beta.1+): app boots → checks the GitHub Releases
# `latest.json` manifest → downloads + verifies signature against the
# minisign pubkey in tauri.conf.json → exposes "update ready" to JS,
# which calls `relaunch()` (process plugin) when the user clicks
# the Restart-to-install button. Distribution flow lives in
# docs/cloud-app/desktop-release-automation.md.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Phase 5 follow-up : localhost HTTP callback server. The `mozart://`
# scheme handoff from browsers is unreliable on Linux (Chrome / Firefox
# silently drop the launch despite "Launched external handler" log).
# Workaround : Tauri spawns a loopback HTTP server on a random port at
# boot ; apps/web fetches `http://127.0.0.1:<port>/auth?token=…&state=…`
# directly. The server synthesizes a `mozart://auth?...` URL and emits
# the same `DeepLinkReceived` event, so the TS adapter / facade flow is
# unchanged. CORS limits incoming requests to the apps/web origins.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tower-http = { version = "0.6", features = ["cors"] }

# Step 1.2 spike deps — used by src/spikes/* and forward-looked by Steps 1.3-1.7
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "2.0.0-rc.22"
specta-typescript = "0.0.9"
portable-pty = "0.8"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
# keyring 3.x defaults to the kernel keyutils backend on Linux ; those
# entries are bound to the process session and disappear when the
# `target/debug/mozart` binary exits. `sync-secret-service` routes the
# crate's sync API through DBus → Secret Service (GNOME Keyring /
# KWallet / kwalletmanager), which persists across logouts and binary
# restarts. macOS uses Keychain ; Windows uses Credential Manager —
# both unchanged by this feature flag.
keyring = { version = "3", features = ["sync-secret-service"] }
# HTTP probe for `GET https://api.anthropic.com/v1/models` (Step 6 connection
# card). `rustls-tls` avoids the system OpenSSL dep; we don't parse response
# bodies, so no `json` feature is needed — status codes carry the result.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

# Phase 4b — repository file tree:
# `ignore` is the ripgrep walker; honors `.gitignore` natively. `notify` +
# `notify-debouncer-mini` back the FS watcher used by `watch_repository_tree`
# (Atom E). Watcher sends a single ping per debounce window; the front-end
# refetches the tree.
ignore = "0.4"
notify = "6"
notify-debouncer-mini = "0.4"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
anyhow = "1"
specta-typescript = "0.0.9"

# Linux-only: direct access to the WebKitGTK settings API so we can
# disable WebKit's animated smooth-scrolling (which feels slower than
# Chromium's discrete wheel scroll on high-velocity mice) and force
# GPU compositing for the scroll surface. Version pinned to match the
# version wry/tauri already pulls in transitively (2.0.x).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
